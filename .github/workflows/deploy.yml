# Vercel's free plan refuses git deploys of commits by non-members (e.g. a CMS editor).
# This asks Vercel to deploy main through a Deploy Hook instead, whoever authored the commit.
# Needs the repo secret VERCEL_DEPLOY_HOOK (Vercel project > Settings > Git > Deploy Hooks, branch main).
name: Deploy to Vercel
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy-main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "::error::Secret VERCEL_DEPLOY_HOOK is not set"; exit 1; fi
          curl -fsS -X POST "$HOOK"
