# Decap CMS config for the Fangled site (editing panel at /admin).
# Each field must exist in the matching src/content/*.json file (npm run check:cms enforces this).
backend:
  name: github
  repo: sebastiangulli/fangled
  branch: main
  base_url: https://fangledgroup.vercel.app
  auth_endpoint: api/auth
publish_mode: simple
media_folder: public/images
public_folder: /images
collections:
  - name: pages
    label: Pages
    files:
      - name: home
        label: Home
        file: src/content/home.json
        fields:
          - label: Browser tab title
            name: docTitle
            widget: string
          - label: Pill above the headline
            name: badge
            widget: object
            collapsed: true
            fields:
              - label: Tag (e.g. New)
                name: tag
                widget: string
              - label: Text
                name: text
                widget: string
          - label: Headline
            name: title
            widget: string
          - label: Intro paragraph
            name: intro
            widget: text
          - label: Three short promises under the buttons
            name: promises
            widget: list
            field:
              label: Text
              name: item
              widget: string
          - label: Scrolling ticker of capabilities
            name: capabilities
            widget: list
            field:
              label: Text
              name: item
              widget: string
          - label: Big statement
            name: statement
            widget: object
            collapsed: true
            fields:
              - label: Statement
                name: text
                widget: text
              - label: Link text
                name: linkLabel
                widget: string
          - label: "Section: The deliverable"
            name: deliverable
            widget: object
            collapsed: true
            fields:
              - label: Small label above the title
                name: eyebrow
                widget: string
                required: false
              - label: Title
                name: title
                widget: string
              - label: Intro text
                name: intro
                widget: text
                required: false
          - label: "Section: What we do (the four cards come from Shared content)"
            name: services
            widget: object
            collapsed: true
            fields:
              - label: Small label above the title
                name: eyebrow
                widget: string
                required: false
              - label: Title
                name: title
                widget: string
              - label: Intro text
                name: intro
                widget: text
                required: false
          - label: "Section: Strategy First Method"
            name: method
            widget: object
            collapsed: true
            fields:
              - label: Small label above the title
                name: eyebrow
                widget: string
                required: false
              - label: Title
                name: title
                widget: string
              - label: Intro text
                name: intro
                widget: text
                required: false
              - label: The three steps
                name: steps
                widget: list
                fields:
                  - label: Step title
                    name: title
                    widget: string
                  - label: Step text
                    name: body
                    widget: text
                min: 3
                max: 3
                hint: "Fixed at 3 items: the page design has exactly 3 slots. Edit the text, not the count."
                summary: "{{fields.title}}"
          - label: "Section: Fractional CMO"
            name: cmo
            widget: object
            collapsed: true
            fields:
              - label: Small label
                name: eyebrow
                widget: string
              - label: Title
                name: title
                widget: string
              - label: Intro text
                name: intro
                widget: text
              - label: Main button text
                name: primaryLabel
                widget: string
              - label: Second button text
                name: secondaryLabel
                widget: string
              - label: "Column name: agency"
                name: agencyLabel
                widget: string
              - label: "Column name: Fractional CMO"
                name: cmoLabel
                widget: string
              - label: Table description for screen readers
                name: tableCaption
                widget: string
              - label: Comparison rows
                name: rows
                widget: list
                fields:
                  - label: Row name
                    name: row
                    widget: string
                  - label: Agency
                    name: agency
                    widget: text
                  - label: Fractional CMO
                    name: cmo
                    widget: text
                summary: "{{fields.row}}"
          - label: "Section: Global trade & sourcing (the checklists come from Shared content)"
            name: globalTrade
            widget: object
            collapsed: true
            fields:
              - label: Small label above the title
                name: eyebrow
                widget: string
                required: false
              - label: Title
                name: title
                widget: string
              - label: Intro text
                name: intro
                widget: text
                required: false
              - label: Link text
                name: linkLabel
                widget: string
              - label: Title of the "also source abroad" card
                name: cardTitle
                widget: string
          - label: "Section: Products (the cards come from Products)"
            name: products
            widget: object
            collapsed: true
            fields:
              - label: Small label above the title
                name: eyebrow
                widget: string
                required: false
              - label: Title
                name: title
                widget: string
              - label: Intro text
                name: intro
                widget: text
                required: false
          - label: "Section: Why Fangled"
            name: why
            widget: object
            collapsed: true
            fields:
              - label: Small label
                name: eyebrow
                widget: string
              - label: Title
                name: title
                widget: string
              - label: Cards
                name: items
                widget: list
                fields:
                  - label: Icon
                    name: icon
                    widget: select
                    options:
                      - Target
                      - Globe2
                      - UserRound
                      - Flag
                      - CalendarCheck
                      - Compass
                      - Layers
                      - UsersRound
                      - Handshake
                      - Rocket
                      - HeartHandshake
                  - label: Title
                    name: title
                    widget: string
                  - label: Text
                    name: body
                    widget: text
                summary: "{{fields.title}}"
          - label: "Section: Podcasts (the episodes come from Shared content)"
            name: podcasts
            widget: object
            collapsed: true
            fields:
              - label: Small label above the title
                name: eyebrow
                widget: string
                required: false
              - label: Title
                name: title
                widget: string
              - label: Intro text
                name: intro
                widget: text
                required: false
              - label: Button text
                name: buttonLabel
                widget: string
      - name: about
