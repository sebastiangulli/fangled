              - label: Message when one is ticked
                name: hintOne
                widget: string
              - label: Message when several are ticked
                name: hintMany
                widget: string
                hint: "Keep {count}: it is replaced by the number ticked."
              - label: Button text
                name: button
                widget: string
          - label: "Section: Beyond growth"
            name: beyondGrowth
            widget: object
            collapsed: true
            fields:
              - label: Small label
                name: eyebrow
                widget: string
              - label: Title
                name: title
                widget: string
              - label: Cards
                name: cards
                widget: list
                fields:
                  - label: Title
                    name: title
                    widget: string
                  - label: Text
                    name: body
                    widget: text
                summary: "{{fields.title}}"
              - label: Title of the example card
                name: reviewTitle
                widget: string
              - label: Badge on the example card
                name: exampleBadge
                widget: string
          - label: Closing call-to-action box
            name: cta
            widget: object
            collapsed: true
            fields:
              - label: Title
                name: title
                widget: string
            hint: Only the title is set here. The text and buttons come from Site-wide settings > Closing call-to-action.
      - name: marketing
