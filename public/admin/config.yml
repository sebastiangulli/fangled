          - label: "Section: Fractional CMO"
            name: fractionalCmo
            widget: object
            collapsed: true
            fields:
              - label: Small label
                name: eyebrow
                widget: string
              - label: Title
                name: title
                widget: string
              - label: Paragraphs
                name: paragraphs
                widget: list
                field:
                  label: Text
                  name: item
                  widget: string
              - label: Title of the checklist
                name: capabilitiesTitle
                widget: string
              - label: Checklist
                name: capabilities
                widget: list
                field:
                  label: Text
                  name: item
                  widget: string
          - label: Fit check (interactive checklist)
            name: fitCheck
            widget: object
            collapsed: true
            fields:
              - label: Title
                name: title
                widget: string
              - label: Statements to tick
                name: painPoints
                widget: list
